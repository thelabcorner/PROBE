name: Build UsageTray OpenCode Go MSI

on:
  push:
    branches:
      - build/usage-tray-opencode-go-msi

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout temporary build assets
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout UsageTray v0.6.28
        uses: actions/checkout@v4
        with:
          repository: Rana-Faraz/usage-tray-windows
          ref: v0.6.28
          path: source

      - name: Inject OpenCode Go Windows fix
        shell: pwsh
        run: |
          Copy-Item -Force "builder/usage-tray-build/opencode-go-plugin.js" "source/plugins/opencode-go/plugin.js"
          Copy-Item -Force "builder/usage-tray-build/opencode-go-plugin.test.js" "source/plugins/opencode-go/plugin.test.js"
          python "builder/usage-tray-build/patch-windows-support.py" "source/src/lib/windows-provider-support.ts"

          $plugin = Get-Content "source/plugins/opencode-go/plugin.js" -Raw
          $support = Get-Content "source/src/lib/windows-provider-support.ts" -Raw
          if ($plugin -notmatch "https://opencode.ai/zen/go/v1/usage") { throw "Usage API endpoint missing" }
          if ($plugin -notmatch "localAppData") { throw "Windows auth fallback missing" }
          if ($support -notmatch '"opencode-go":\s*\{\s*status:\s*"v1"') { throw "OpenCode Go still not v1 on Windows" }
          if ($support -match "needs a Windows storage strategy") { throw "Stale Planned for Windows gate remains" }

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: source
        run: bun install --frozen-lockfile

      - name: Validate OpenCode Go provider
        working-directory: source
        run: |
          node --check plugins/opencode-go/plugin.js
          bun test plugins/opencode-go/plugin.test.js

      - name: Build Windows MSI
        working-directory: source
        run: bunx tauri build --bundles msi --no-sign

      - name: Verify compiled Windows support and bundled provider
        shell: pwsh
        run: |
          $bundledPath = "source/src-tauri/resources/bundled_plugins/opencode-go/plugin.js"
          $bundled = Get-Content $bundledPath -Raw
          if ($bundled -notmatch "https://opencode.ai/zen/go/v1/usage") { throw "Bundled provider missing usage endpoint" }
          if ($bundled -notmatch "localAppData") { throw "Bundled provider missing Windows auth fallback" }

          $distText = (Get-ChildItem -Path "source/dist" -Recurse -File | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          if ($distText -match "OpenCode Go currently assumes a Unix local-share layout") { throw "Compiled UI still contains stale Planned for Windows message" }
          if ($distText -notmatch "No local OpenCode Go API key was detected") { throw "Compiled UI does not contain Windows-supported OpenCode Go note" }

          $msi = Get-ChildItem -Path "source/src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI artifact not found" }
          Get-FileHash -Algorithm SHA256 $msi.FullName | Format-List
          Write-Host "Built MSI: $($msi.FullName)"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: UsageTray-0.6.28-OpenCodeGo-API-WindowsFix
          path: source/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
