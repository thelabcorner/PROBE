name: Build UsageTray OpenCode Go MSI

on:
  push:
    branches:
      - build/usage-tray-opencode-go-msi

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout temporary build assets
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout UsageTray v0.6.28
        uses: actions/checkout@v4
        with:
          repository: Rana-Faraz/usage-tray-windows
          ref: v0.6.28
          path: source

      - name: Inject OpenCode Go usage API provider
        shell: pwsh
        run: |
          Copy-Item -Force "builder/usage-tray-build/opencode-go-plugin.js" "source/plugins/opencode-go/plugin.js"
          $plugin = Get-Content "source/plugins/opencode-go/plugin.js" -Raw
          if ($plugin -notmatch "https://opencode.ai/zen/go/v1/usage") {
            throw "OpenCode Go usage API endpoint was not injected."
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: source
        run: bun install --frozen-lockfile

      - name: Validate provider syntax
        working-directory: source
        run: node --check plugins/opencode-go/plugin.js

      - name: Build Windows MSI
        working-directory: source
        run: bunx tauri build --bundles msi --no-sign

      - name: Verify bundled provider and MSI
        shell: pwsh
        run: |
          $bundledPath = "source/src-tauri/resources/bundled_plugins/opencode-go/plugin.js"
          $bundled = Get-Content $bundledPath -Raw
          if ($bundled -notmatch "https://opencode.ai/zen/go/v1/usage") {
            throw "Bundled provider does not contain the new OpenCode Go usage endpoint."
          }
          $msi = Get-ChildItem -Path "source/src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "MSI artifact not found."
          }
          Write-Host "Built MSI: $($msi.FullName)"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: UsageTray-0.6.28-OpenCodeGo-API-MSI
          path: source/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
